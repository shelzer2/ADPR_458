<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sam Helzer Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #e9e9e9;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 30px;
    }

  
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 500;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-size: 1.1rem;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 60px;
      margin-bottom: 60px;
    }

    .card {
      width: 45%;
    }

    .card h2 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .image-placeholder {
      width: 220px;
      height: 180px;
      background-color: #9a9a9a;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background-color: red;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
    }

    
    .cta-box {
      width: 65%;
      min-height: 130px;
      background-color: #d3d3d3;
      padding: 20px;
      margin-bottom: 30px;
    }

    .footer-button {
      background-color: black;
      padding: 20px 0 40px 0;
    }

    .footer-button .btn {
      margin-left: 30px;
    }


    @media (max-width: 768px) {
      header,
      .hero {
        flex-direction: column;
        align-items: flex-start;
      }

      .card,
      .cta-box {
        width: 100%;
      }

      nav ul {
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Sam Helzer</div>
      <nav>
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#work">Work</a></li>
          <li><a href="#resume">Resume</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <div class="card" id="about">
        <h2>Header</h2>
        <p>Bio section about me</p>
        <div class="image-placeholder"></div>
        <a href="#resume" class="btn">Resume</a>
      </div>

      <div class="card" id="work">
        <h2>My Creative Executions</h2>
        <p>Bio about my work</p>
        <div class="image-placeholder"></div>
        <a href="#work" class="btn">My Work</a>
      </div>
    </section>

    <section class="cta-box">
      <p>Call to action</p>
    </section>
  </div>

  <footer class="footer-button" id="contact">
    <a href="mailto:youremail@example.com" class="btn">Contact Me</a>
  </footer>
</body>
</html>
